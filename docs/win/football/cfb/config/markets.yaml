selection_defaults:
  min_ev: -1.00
  min_edge: -1.00
  min_kelly: 0.00
  max_kelly: 1.00
  min_odds_american: -100000
  max_odds_american: 100000
  min_model_prob: 0.00
  max_model_prob: 1.00


markets:

  ###################################################
  # ── Moneyline ────────────────────────────────────
  ###################################################

  moneyline:
    enabled: true
    pick_preference: best_ev

    home:
      enabled: true
      min_ev: -0.05
      odds_bands:
        - [-20000, 1549]

    away:
      enabled: true
      min_ev: 0.00
      min_model_prob: 0.55


  ###################################################
  # ── Spread ───────────────────────────────────────
  ###################################################

  spread:
    enabled: true
    pick_preference: best_ev
    max_spread_abs: 35.0

    home:
      enabled: true
      min_kelly: 0.10
      line_bands:
        - [-9.0, 13.999999]

    away:
      enabled: true
      line_bands:
        - [-21.0, -14.000001]


  ###################################################
  # ── Totals ───────────────────────────────────────
  ###################################################

  total:
    enabled: true
    pick_preference: best_ev
    min_total: 0.0
    max_total: 100.0

    over:
      enabled: true
      min_ev: -0.15
      min_model_prob: 0.45
      odds_bands:
        - [-150, -101]
      line_bands:
        - [35.0, 54.999999]

    under:
      enabled: true
      min_ev: 0.00
      odds_bands:
        - [-150, -101]
      line_bands:
        - [55.0, 84.999999]
