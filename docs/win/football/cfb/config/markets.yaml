selection_defaults:
  min_ev: -1.00
  min_edge: -1.00
  min_kelly: 0.00
  max_kelly: 1.00
  min_odds_american: -100000
  max_odds_american: 100000
  min_model_prob: 0.00
  max_model_prob: 1.00

  
## pick_preference OPTIONS:
  ## best_ev → choose the qualifying side with the highest EV
  ## best_prob → choose the qualifying side with the highest model_probability
  ## best_kelly → choose the qualifying side with the highest Kelly


markets:

  ###################################################
  # ── Moneyline ────────────────────────────────────
  ###################################################

  moneyline:
    enabled: true
    pick_preference: best_prob

    home:
      enabled: true
      min_ev: -0.05
      odds_bands:
        - [-20000, 1549]
      min_model_prob: 0.55

    away:
      enabled: true
      min_ev: 0.00
      min_model_prob: 0.55


  ###################################################
  # ── Spread ───────────────────────────────────────
  ###################################################

  spread:
    enabled: true
    pick_preference: best_prob
    max_spread_abs: 35.0

    home:
      enabled: true
      min_kelly: 0.10
      line_bands:
        - [-9.0, 13.999999]
      prob_bands:
        - [0.55, 0.599]
        - [0.65, 0.99]

    away:
      enabled: true
      line_bands:
        - [-21.0, -14.000001]
      prob_bands:
        - [0.55, 0.599]
        - [0.65, 0.99]


  ###################################################
  # ── Totals ───────────────────────────────────────
  ###################################################

  total:
    enabled: true
    pick_preference: best_kelly
    min_total: 0.0
    max_total: 100.0

    over:
      enabled: true
      min_ev: -0.15
      min_model_prob: 0.45
      odds_bands:
        - [-150, -101]
      line_bands:
        - [35.0, 54.999999]
      kelly_bands:
        - [0.001, 0.0499]

    under:
      enabled: true
      min_ev: 0.00
      odds_bands:
        - [-150, -101]
      line_bands:
        - [55.0, 84.999999]
      kelly_bands:
        - [0.001, 0.0499]
