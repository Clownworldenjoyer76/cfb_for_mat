selection_defaults:
  min_ev: -1.00
  min_edge: -1.00
  min_kelly: 0.00
  max_kelly: 1.00
  min_odds_american: -100000
  max_odds_american: 100000
  min_model_prob: 0.00
  max_model_prob: 1.00


###################################################
# ── Cross-Market Selection Rules ────────────────
###################################################

## moneyline_vs_spread.mode OPTIONS:
##   exclusive  → moneyline OR spread, never both
##   allow_both → moneyline and spread may both be selected
##
## moneyline_vs_spread.preference OPTIONS
## when mode=exclusive and both markets qualify:
##
##   moneyline  → always keep moneyline
##   spread     → always keep spread
##   best_ev    → keep the market with the higher EV
##   best_prob  → keep the market with the higher model probability
##   best_kelly → keep the market with the higher Kelly
##
## Total remains independent.
##
## With:
##   mode: exclusive
##   preference: best_prob
##
## Maximum selections per game become:
##   [MONEYLINE OR SPREAD] + [TOTAL]
##   max = 2

selection_rules:

  moneyline_vs_spread:
    mode:  allow_both
    preference: best_prob


###################################################
# ── Per-Market Pick Preference Options ──────────
###################################################

## pick_preference OPTIONS:
##   best_ev    → choose the qualifying side with the highest EV
##   best_prob  → choose the qualifying side with the highest model_probability
##   best_kelly → choose the qualifying side with the highest Kelly


markets:

  ###################################################
  # ── Moneyline ────────────────────────────────────
  ###################################################

  moneyline:
    enabled: true
    pick_preference: best_prob

    home:
      enabled: true
      min_ev: 0.00
      odds_bands:
        - [-300, 2000]
      kelly_bands:
        - [0.0, 0.20]
      min_model_prob: 0.70

    away:
      enabled: true
      min_ev: 0.00
      odds_bands:
        - [-300, 2000]
      kelly_bands:
        - [0.0, 0.20]
      min_model_prob: 0.70


  ###################################################
  # ── Spread ───────────────────────────────────────
  ###################################################

  spread:
    enabled: true
    pick_preference: best_prob
    max_spread_abs: 99.0

    home:
      enabled: true
      line_bands:
        - [-99.0, 99.0]
      odds_bands:
        - [-300, -110]
      prob_bands:
        - [0.50, 0.65]

    away:
      enabled: true
      line_bands:
        - [-99.0, 99.0]
      odds_bands:
        - [-300, 300]
      prob_bands:
        - [0.70, 1.00]


  ###################################################
  # ── Totals ───────────────────────────────────────
  ###################################################

  total:
    enabled: true
    pick_preference: best_prob
    min_total: 0.0
    max_total: 100.0

    over:
      enabled: true
      min_ev: 0.00
      min_model_prob: 0.00
      odds_bands:
        - [-500, 5000]
      line_bands:
        - [0.0, 99.0]
      kelly_bands:
        - [0.0, 1.0]
      min_model_prob: 0.50
        
    under:
      enabled: true
      min_ev: 0.00
      odds_bands:
        - [-500, -110]
      line_bands:
        - [0.0, 99.0]
      kelly_bands:
        - [0.0, 1.0]
      min_model_prob: 0.60
