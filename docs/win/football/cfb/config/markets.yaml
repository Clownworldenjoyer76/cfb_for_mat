  min_odds_american: -1000
  max_odds_american: 1000
  min_model_prob: 0.05
  max_model_prob: 0.95


markets:

  ###################################################
  # ── Moneyline ────────────────────────────────────
  ###################################################

  moneyline:
    enabled: true
    pick_preference: best_ev
    min_model_prob: 0.27
    min_kelly: 0.016

    home:
      enabled: true

    away:
      enabled: true


  ###################################################
  # ── Spread ───────────────────────────────────────
  ###################################################

  spread:
    enabled: true
    pick_preference: best_ev
    max_spread_abs: 35.0

    home:
      enabled: true

    away:
      enabled: true


  ###################################################
  # ── Totals ───────────────────────────────────────
  ###################################################

  total:
    enabled: true
    pick_preference: best_ev
    min_total: 35.0
    max_total: 80.0

    over:
      enabled: true

    under:
      enabled: true