# docs/win/football/cfb/config/settings.yaml
#
# Global live-pipeline settings.
# Pipeline target season/week/season_type belong in current_week.yaml.
# Market-specific selection overrides belong in markets.yaml.

sportsbook: draftkings
odds_region: us
odds_format: american

# Default thresholds used by selections.py.
# Any individual market may override these keys in markets.yaml.
selection_defaults:
  min_ev: 0.00
  min_edge: 0.00
  min_kelly: 0.00
  max_kelly: 1.00

  min_odds_american: -10000
  max_odds_american: 10000

  min_model_prob: 0.00
  max_model_prob: 1.00

# Global game eligibility rules.
game_filters:
  allow_playoffs: false
  allow_neutral_site: true
  allow_dome_games: true
  allow_weather_missing: true
