name: CFB Pull Opening Odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-opening-odds:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python docs/win/football/cfb/scripts/00_intake/pull_opening_odds.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/cfb

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update CFB opening odds"
          git push origin "HEAD:${GITHUB_REF_NAME}"
