name: CFB Pull Schedule

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-schedule:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python docs/win/football/cfb/scripts/00_intake/pull_schedule.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/football/cfb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update CFB schedule"
          git push
