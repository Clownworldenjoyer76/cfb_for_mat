name: CFB Week 1 Projection

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CFB_SEASON: "2026"

jobs:
  run-week1-projection:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pandas numpy

      - name: Run Week 1 projection
        run: |
          python docs/win/football/cfb/scripts/01_merge/projection_week1.py \
            --season 2026 \
            --prior-season 2025 \
            --week 1

      - name: Commit projection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/cfb/01_merge/week_1_CFB_enriched.csv

          if git diff --cached --quiet; then
            echo "No projection changes to commit."
            exit 0
          fi

          git commit -m "Update CFB Week 1 projection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
