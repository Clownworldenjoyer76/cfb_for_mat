name: Qodana

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/win/football/cfb/requirements.txt

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-python
            --within-docker false
            --baseline .qodana/baseline.sarif.json
            --only-directory docs/win/football/cfb
          pr-mode: false
          use-annotations: false
          post-pr-comment: false
          push-fixes: none
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_8361585 }}
          QODANA_ENDPOINT: https://qodana.cloud
          QODANA_PYTHON_PATH: ${{ steps.python.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/docs/win/football/cfb/scripts