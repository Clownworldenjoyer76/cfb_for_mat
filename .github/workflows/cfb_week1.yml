name: CFB Week 1 Script Run

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CFB_SEASON: "2026"

jobs:
  run-cfb-week1-scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pandas numpy pyyaml pyarrow polars xgboost sportsdataverse==0.0.75

      - run: python docs/win/football/cfb/scripts/00_intake/pull_schedule.py
      - run: python docs/win/football/cfb/scripts/00_intake/pull_odds.py
      - run: python docs/win/football/cfb/scripts/00_intake/build_weekly_schedule.py
      - run: python docs/win/football/cfb/scripts/00_intake/pull_opening_odds.py
      - run: python docs/win/football/cfb/scripts/00_intake/league_master.py
      - run: python docs/win/football/cfb/scripts/00_intake/pull_raw_roster.py
      - run: python docs/win/football/cfb/scripts/00_intake/roster_cleanup.py

      # Depth charts removed from CFB pipeline.
      # - run: python docs/win/football/cfb/scripts/00_intake/depth_chart.py
      # - run: python docs/win/football/cfb/scripts/00_intake/depth_cleanup.py

      - run: python docs/win/football/cfb/scripts/00_intake/coaches.py
      - run: python docs/win/football/cfb/scripts/00_intake/team_power_index.py
      - run: python docs/win/football/cfb/scripts/00_intake/pull_injuries.py

      # WEEK 1:
      # Do not run pull_pbp.py because no completed 2026 games exist yet.
      # Use the frozen 2025 PBP already in the repo to build prior-season stats.
      - run: python docs/win/football/cfb/scripts/00_intake/pull_team_stats.py --season 2025

      - run: python docs/win/football/cfb/scripts/00_intake/pull_e_predictions.py
      - run: python docs/win/football/cfb/scripts/00_intake/clean_e_pred.py
      - run: python docs/win/football/cfb/scripts/00_intake/finalize_pred.py
      - run: python docs/win/football/cfb/scripts/00_intake/build_travel.py
      - run: python docs/win/football/cfb/scripts/00_intake/fetch_weather.py

      # Build Week 1 projections and betting probabilities.
      - run: |
          python docs/win/football/cfb/scripts/01_merge/projection_week1.py \
            --season 2026 \
            --prior-season 2025 \
            --week 1

      # Build raw moneyline, spread, and total candidates.
      - run: |
          python docs/win/football/cfb/scripts/02_select/selections.py \
            --season 2026 \
            --week 1

      # Apply markets.yaml filters and create final selections.
      - run: python docs/win/football/cfb/scripts/03_picks/picks.py

      # Build compact all-games projection output.
      - run: |
          python docs/win/football/cfb/scripts/03_picks/all_games_picks.py \
            --week 1

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/football/cfb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Run CFB Week 1 pipeline"
          git push origin "HEAD:${GITHUB_REF_NAME}"