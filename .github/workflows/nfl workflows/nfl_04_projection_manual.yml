name: NFL 04 Projection Manual

on:
  workflow_dispatch:
    inputs:
      projection_mode:
        description: Projection script to run
        required: true
        default: week1
        type: choice
        options:
          - week1
          - inseason

permissions:
  contents: write

jobs:
  projection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy catboost pyarrow

      - name: Run Week 1 projection
        if: ${{ inputs.projection_mode == 'week1' }}
        run: python docs/win/football/nfl/scripts/01_merge/projection_week1.py

      - name: Run in-season projection
        if: ${{ inputs.projection_mode == 'inseason' }}
        run: python docs/win/football/nfl/scripts/01_merge/projection.py

      - name: Commit projection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/football/nfl/01_merge/

          if git diff --cached --quiet; then
            echo "No projection output changes to commit."
          else
            git commit -m "Update NFL projection output"
            git push
          fi
