name: NFL 00 Drat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest

    env:
      SOURCE_REPO: Clownworldenjoyer76/nikki_and_mat_bets
      SOURCE_BRANCH: main
      SOURCE_PATH: docs/data/weekly
      TARGET_PATH: docs/win/football/nfl/00_intake/predictions/drat/raw

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: .source

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify source folder exists
        run: |
          set -e
          if [ ! -d ".source/${SOURCE_PATH}" ]; then
            echo "ERROR: ${SOURCE_PATH} not found in ${SOURCE_REPO}@${SOURCE_BRANCH}"
            exit 1
          fi
          echo "Files found in source:"
          ls -la ".source/${SOURCE_PATH}"

      - name: Replace target path with source contents
        run: |
          set -e
          rm -rf "${TARGET_PATH}"
          mkdir -p "${TARGET_PATH}"
          cp -R ".source/${SOURCE_PATH}/." "${TARGET_PATH}/"

          echo "Files now in ${TARGET_PATH}:"
          ls -la "${TARGET_PATH}"

      - name: Clean DRAT files
        id: clean_drat
        shell: bash
        run: |
          set +e

          python docs/win/football/nfl/scripts/00_intake/clean_drat.py
          status=$?

          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            docs/win/football/nfl/00_intake/predictions/drat/raw \
            docs/win/football/nfl/00_intake/predictions/drat/clean \
            docs/win/football/nfl/errors/00_intake/clean_drat.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Pull and clean weekly DRAT predictions"
            git push
          fi

      - name: Fail workflow if DRAT cleaning failed
        if: steps.clean_drat.outputs.exit_code != '0'
        run: |
          echo "clean_drat.py reported errors."
          echo "See docs/win/football/nfl/errors/00_intake/clean_drat.txt"
          exit 1
