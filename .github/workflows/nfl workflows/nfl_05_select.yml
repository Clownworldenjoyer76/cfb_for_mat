name: NFL 05 Select

# MANUAL RUN ONLY.
#
# Runs the NFL selection pipeline for every available weekly projection file.
#
# Step 1:
# - finds every docs/win/football/nfl/01_merge/week_*_NFL_enriched.csv
# - runs selections.py for each available week
# - writes docs/win/football/nfl/02_select/week_*_NFL_selected.csv
#
# Step 2:
# - runs picks.py for every generated selected file
# - applies config/markets.yaml
# - writes docs/win/football/nfl/03_picks/week_*_NFL_picks.csv
#
# Step 3:
# - runs all_games_picks.py for every generated selected file
# - writes compact projected-score files under:
#   docs/win/football/nfl/03_picks/all_games/
#
# All generated outputs are committed back to the repository.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nfl-select:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml

      - name: Run NFL selection engine for all weeks
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          FILES=(
            docs/win/football/nfl/01_merge/week_*_NFL_enriched.csv
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "ERROR: No weekly enriched files found."
            exit 1
          fi

          for FILE in "${FILES[@]}"; do
            BASENAME="$(basename "$FILE")"
            WEEK="${BASENAME#week_}"
            WEEK="${WEEK%_NFL_enriched.csv}"

            echo "Running selections.py for Week $WEEK"

            python docs/win/football/nfl/scripts/02_select/selections.py \
              --week "$WEEK"
          done

      - name: Run NFL picks filter for all weeks
        run: |
          python docs/win/football/nfl/scripts/03_picks/picks.py

      - name: Run all-games picks for all weeks
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          FILES=(
            docs/win/football/nfl/02_select/week_*_NFL_selected.csv
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "ERROR: No weekly selected files found."
            exit 1
          fi

          for FILE in "${FILES[@]}"; do
            BASENAME="$(basename "$FILE")"
            WEEK="${BASENAME#week_}"
            WEEK="${WEEK%_NFL_selected.csv}"

            echo "Running all_games_picks.py for Week $WEEK"

            python docs/win/football/nfl/scripts/03_picks/all_games_picks.py \
              --week "$WEEK"
          done

      - name: Commit selection and picks outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/nfl/02_select/
          git add docs/win/football/nfl/03_picks/

          if git diff --cached --quiet; then
            echo "No NFL selection or picks output changes to commit."
          else
            git commit -m "Run NFL selections and picks for all available weeks"
            git push
          fi
