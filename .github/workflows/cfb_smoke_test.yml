name: CFB Smoke Test

run-name: CFB smoke test - 2026

on:
  workflow_dispatch:
    inputs:
      run_odds_dependent_steps:
        description: Run build_weekly_schedule, finalize_pred, build_travel, and fetch_weather
        required: true
        default: false
        type: boolean
      pbp_workers:
        description: Concurrent ESPN game pulls for pull_pbp.py
        required: true
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: cfb-smoke-test-${{ github.ref }}
  cancel-in-progress: false

env:
  CFB_SEASON: "2026"
  CFB_ROOT: docs/win/football/cfb
  SCRIPT_DIR: docs/win/football/cfb/scripts/00_intake
  PYTHONUNBUFFERED: "1"

jobs:
  smoke-test:
    name: CFB intake integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check pandas numpy pyyaml

      - name: Preflight required CFB files
        shell: bash
        run: |
          set -euo pipefail

          test -s "$CFB_ROOT/config/mapping/team_map.csv"
          test -s "$CFB_ROOT/config/mapping/stadium_map.csv"
          test -s "$CFB_ROOT/data/master/team_master.csv"

          team_map_header="$(head -n 1 "$CFB_ROOT/config/mapping/team_map.csv" | tr -d '\r')"
          for col in team_id canonical_team team_abbr alt_color team_color guid alternateIds_sdr; do
            case ",$team_map_header," in
              *",$col,"*) ;;
              *)
                echo "::error file=$CFB_ROOT/config/mapping/team_map.csv::Missing required column: $col"
                exit 1
                ;;
            esac
          done

          stadium_header="$(head -n 1 "$CFB_ROOT/config/mapping/stadium_map.csv" | tr -d '\r')"
          for col in team stadium latitude longitude timezone roof_type venue_country; do
            case ",$stadium_header," in
              *",$col,"*) ;;
              *)
                echo "::error file=$CFB_ROOT/config/mapping/stadium_map.csv::Missing required column: $col"
                exit 1
                ;;
            esac
          done

          echo "Preflight passed."

      - name: 01 - pull_schedule.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/pull_schedule.py"
          test -s "$CFB_ROOT/00_intake/schedule/${CFB_SEASON}_schedule.csv"

      - name: Check schedule output
        shell: bash
        run: |
          set -euo pipefail
          file="$CFB_ROOT/00_intake/schedule/${CFB_SEASON}_schedule.csv"
          rows=$(( $(wc -l < "$file") - 1 ))
          echo "schedule_rows=$rows"
          test "$rows" -gt 0

      - name: 02 - build_weekly_schedule.py
        if: ${{ inputs.run_odds_dependent_steps }}
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/build_weekly_schedule.py"
          find "$CFB_ROOT/00_intake/schedule/weekly" \
            -maxdepth 1 -type f -name 'week_*_CFB_weekly_schedule.csv' -print -quit \
            | grep -q .

      - name: 03 - league_master.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/league_master.py"
          test -s "$CFB_ROOT/data/master/league_master.csv"
          test -s "$CFB_ROOT/data/master/league_standings.csv"

      - name: 04 - pull_raw_roster.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/pull_raw_roster.py"
          test -s "$CFB_ROOT/data/raw/raw_roster.csv"

      - name: 05 - roster_cleanup.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/roster_cleanup.py"
          test -s "$CFB_ROOT/data/master/roster_master.csv"

      - name: 06 - depth_chart.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/depth_chart.py"
          test -s "$CFB_ROOT/data/raw/raw_depth.csv"

      - name: 07 - depth_cleanup.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/depth_cleanup.py"
          find "$CFB_ROOT/data/master/depth_charts" \
            -type f -name '*_depth.csv' -print -quit \
            | grep -q .

      - name: 08 - coaches.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/coaches.py"
          test -s "$CFB_ROOT/data/master/coaches_master.csv"

      - name: 09 - team_power_index.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/team_power_index.py"
          test -s "$CFB_ROOT/data/team_power_index/team_power_index_${CFB_SEASON}.csv"

      - name: 10 - pull_injuries.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/pull_injuries.py"
          test -s "$CFB_ROOT/00_intake/injuries/${CFB_SEASON}_injuries.csv"

      - name: 11 - pull_pbp.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/pull_pbp.py" \
            --season "$CFB_SEASON" \
            --workers "${{ inputs.pbp_workers }}"

          pbp="$CFB_ROOT/00_intake/pbp/${CFB_SEASON}_pbp.csv.gz"
          test -s "$pbp"
          gzip -t "$pbp"

      - name: Check normalized PBP contract
        shell: bash
        run: |
          set -euo pipefail

          pbp="$CFB_ROOT/00_intake/pbp/${CFB_SEASON}_pbp.csv.gz"
          header="$(gzip -cd "$pbp" | sed -n '1p' | tr -d '\r')"

          for col in \
            season week game_id play_id posteam defteam play_type \
            epa success yards_gained down yardline_100 fixed_drive \
            posteam_score posteam_score_post touchdown td_team \
            third_down_converted third_down_failed first_down; do
            case ",$header," in
              *",$col,"*) ;;
              *)
                echo "::error file=$pbp::Normalized PBP missing required column: $col"
                exit 1
                ;;
            esac
          done

          rows=$(( $(gzip -cd "$pbp" | wc -l) - 1 ))
          echo "pbp_rows=$rows"
          test "$rows" -gt 0

      - name: 12 - pull_team_stats.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/pull_team_stats.py" --season "$CFB_SEASON"

          stats="$CFB_ROOT/00_intake/team_stats/${CFB_SEASON}_team_stats.csv"
          test -s "$stats"
          rows=$(( $(wc -l < "$stats") - 1 ))
          echo "team_stat_rows=$rows"
          test "$rows" -gt 0

      - name: 13 - pull_e_predictions.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/pull_e_predictions.py"
          find "$CFB_ROOT/00_intake/predictions/e_predictions" \
            -maxdepth 1 -type f -name '*_e_predictions.csv' -print -quit \
            | grep -q .

      - name: 14 - clean_e_pred.py
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/clean_e_pred.py"
          find "$CFB_ROOT/00_intake/predictions/clean" \
            -maxdepth 1 -type f -name '*_predictions.csv' -print -quit \
            | grep -q .

      - name: 15 - finalize_pred.py
        if: ${{ inputs.run_odds_dependent_steps }}
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/finalize_pred.py"
          find "$CFB_ROOT/00_intake/predictions/final" \
            -maxdepth 1 -type f -name '*_clean_predictions.csv' -print -quit \
            | grep -q .

      - name: 16 - build_travel.py
        if: ${{ inputs.run_odds_dependent_steps }}
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/build_travel.py"
          find "$CFB_ROOT/data/travel" \
            -maxdepth 1 -type f -name '*_week_*_travel.csv' -print -quit \
            | grep -q .

      - name: 17 - fetch_weather.py
        if: ${{ inputs.run_odds_dependent_steps }}
        shell: bash
        run: |
          set -euo pipefail
          python "$SCRIPT_DIR/fetch_weather.py"
          find "$CFB_ROOT/data/weather" \
            -maxdepth 1 -type f -name 'week_*_CFB_weekly_weather.csv' -print -quit \
            | grep -q .

      - name: Output inventory
        if: always()
        shell: bash
        run: |
          set +e
          echo "===== CFB generated files ====="
          find "$CFB_ROOT/00_intake" "$CFB_ROOT/data" "$CFB_ROOT/errors" \
            -type f -print 2>/dev/null | sort

      - name: Upload smoke-test outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-smoke-test-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            docs/win/football/cfb/errors/00_intake/**
            docs/win/football/cfb/00_intake/schedule/**
            docs/win/football/cfb/00_intake/injuries/**
            docs/win/football/cfb/00_intake/pbp/**
            docs/win/football/cfb/00_intake/team_stats/**
            docs/win/football/cfb/00_intake/predictions/**
            docs/win/football/cfb/data/raw/**
            docs/win/football/cfb/data/master/**
            docs/win/football/cfb/data/team_power_index/**
            docs/win/football/cfb/data/travel/**
            docs/win/football/cfb/data/weather/**
