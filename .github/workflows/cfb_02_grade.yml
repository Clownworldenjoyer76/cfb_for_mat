name: CFB 02 Grading

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cfb-rebuild-all-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load CFB season
        shell: bash
        run: |
          CFB_SEASON="$(
            sed -n 's/^[[:space:]]*season:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' docs/win/football/cfb/config/current_week.yaml |
              head -1
          )"

          if ! [[ "$CFB_SEASON" =~ ^20[0-9]{2}$ ]]; then
            echo "ERROR: Invalid or missing season in docs/win/football/cfb/config/current_week.yaml"
            exit 1
          fi

          echo "CFB_SEASON=$CFB_SEASON" >> "$GITHUB_ENV"
          echo "Configured CFB season: $CFB_SEASON"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: docs/win/football/cfb/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r docs/win/football/cfb/requirements.txt

      # ----------------------------------------------------------------------
      # REAPPLY markets.yaml TO EVERY EXISTING WEEK
      #
      # Every existing:
      #   docs/win/football/cfb/02_select/week_*_CFB_selected.csv
      #
      # is processed using the CURRENT markets.yaml settings.
      # ----------------------------------------------------------------------

      - name: Rebuild picks for all existing weeks
        run: |
          python docs/win/football/cfb/scripts/03_picks/picks.py \
            --pattern "week_*_CFB_selected.csv"

      # ----------------------------------------------------------------------
      # REBUILD DERIVED PICK OUTPUTS FOR EVERY EXISTING WEEK
      # ----------------------------------------------------------------------

      - name: Rebuild all weekly pick outputs
        shell: bash
        run: |
          set -euo pipefail

          FOUND=0

          for file in docs/win/football/cfb/02_select/week_*_CFB_selected.csv; do
            if [ ! -f "$file" ]; then
              continue
            fi

            FOUND=1

            filename="$(basename "$file")"
            week="${filename#week_}"
            week="${week%_CFB_selected.csv}"

            if ! [[ "$week" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Could not parse week from: $filename"
              exit 1
            fi

            echo "=================================================="
            echo "Rebuilding CFB Week $week"
            echo "=================================================="

            python docs/win/football/cfb/scripts/03_picks/clean_weekly_picks.py \
              --week "$week"

            python docs/win/football/cfb/scripts/03_picks/all_games_picks.py \
              --week "$week"

            python docs/win/football/cfb/scripts/03_picks/final_picks.py \
              --week "$week"
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: No existing CFB selected files found."
            exit 1
          fi

      # ----------------------------------------------------------------------
      # VERIFY RECALCULATED PICK OUTPUTS
      # ----------------------------------------------------------------------

      - name: Verify all weekly pick outputs
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          from pathlib import Path

          season = int(os.environ["CFB_SEASON"])
          selected_dir = Path("docs/win/football/cfb/02_select")
          selected_files = sorted(selected_dir.glob("week_*_CFB_selected.csv"))

          if not selected_files:
              raise RuntimeError("No existing CFB selected files found.")

          required = {"season", "week", "game_id"}

          def as_int(value, field, path, line):
              try:
                  number = float(str(value).strip())
              except (TypeError, ValueError):
                  raise RuntimeError(
                      f"{path}: invalid {field} at line {line}: {value!r}"
                  )
              if not number.is_integer():
                  raise RuntimeError(
                      f"{path}: invalid {field} at line {line}: {value!r}"
                  )
              return int(number)

          def verify(path, expected_week):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"{path}: missing or empty")

              try:
                  with path.open(newline="", encoding="utf-8-sig") as handle:
                      reader = csv.DictReader(handle, strict=True)
                      fields = set(reader.fieldnames or [])
                      missing = required - fields
                      if missing:
                          raise RuntimeError(
                              f"{path}: missing required columns: {sorted(missing)}"
                          )
                      rows = list(reader)
              except csv.Error as exc:
                  raise RuntimeError(f"{path}: malformed CSV: {exc}") from exc

              if not reader.fieldnames:
                  raise RuntimeError(f"{path}: missing CSV header")

              is_selected_output = (
                  path.parent.name == "selected"
                  and path.name == f"week_{expected_week}_CFB_select_picks.csv"
              )

              if not rows and not is_selected_output:
                  raise RuntimeError(f"{path}: contains no data rows")

              for line, row in enumerate(rows, start=2):
                  if None in row or any(value is None for value in row.values()):
                      raise RuntimeError(f"{path}: malformed row at line {line}")
                  if as_int(row["season"], "season", path, line) != season:
                      raise RuntimeError(f"{path}: wrong season at line {line}")
                  if as_int(row["week"], "week", path, line) != expected_week:
                      raise RuntimeError(f"{path}: wrong week at line {line}")
                  if not str(row["game_id"]).strip():
                      raise RuntimeError(f"{path}: blank game_id at line {line}")

              print(f"Verified {path}: {len(rows)} rows")

          for selected in selected_files:
              match = re.fullmatch(r"week_(\d+)_CFB_selected\.csv", selected.name)
              if not match:
                  raise RuntimeError(f"Could not parse week from {selected.name}")

              week = int(match.group(1))

              paths = (
                  Path(f"docs/win/football/cfb/01_merge/week_{week}_CFB_enriched.csv"),
                  Path(f"docs/win/football/cfb/02_select/week_{week}_CFB_selected.csv"),
                  Path(f"docs/win/football/cfb/03_picks/week_{week}_CFB_picks.csv"),
                  Path(f"docs/win/football/cfb/03_picks/cleaned/week_{week}_CFB_clean_picks.csv"),
                  Path(f"docs/win/football/cfb/03_picks/all_games/all_week_{week}_CFB_picks.csv"),
                  Path(f"docs/win/football/cfb/03_picks/selected/week_{week}_CFB_select_picks.csv"),
              )

              for path in paths:
                  verify(path, week)

          print("All existing CFB weekly pick outputs verified.")
          PY

      # ----------------------------------------------------------------------
      # REFRESH FINAL SCORES
      #
      # Pull season results before grading so every completed game currently
      # available from ESPN can be graded.
      # ----------------------------------------------------------------------

      - name: Pull final CFB scores
        run: |
          python docs/win/football/cfb/scripts/04_final_results/pull_final_scores.py \
            --season "$CFB_SEASON"

      # ----------------------------------------------------------------------
      # GRADE ALL EXISTING WEEKS
      #
      # No --week argument is supplied, so grade_picks.py processes every
      # existing week_*_CFB_picks.csv for the configured season.
      # ----------------------------------------------------------------------

      - name: Grade all CFB bets
        run: |
          python docs/win/football/cfb/scripts/04_final_results/grade_picks.py \
            --season "$CFB_SEASON"

      # ----------------------------------------------------------------------
      # VERIFY GRADED FILES FOR EVERY EXISTING WEEK
      # ----------------------------------------------------------------------

      - name: Verify all graded CFB weeks
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          from pathlib import Path

          season = int(os.environ["CFB_SEASON"])
          selected_files = sorted(
              Path("docs/win/football/cfb/02_select").glob("week_*_CFB_selected.csv")
          )

          if not selected_files:
              raise RuntimeError("No existing CFB weeks found.")

          def as_int(value, field, path, line):
              try:
                  number = float(str(value).strip())
              except (TypeError, ValueError):
                  raise RuntimeError(
                      f"{path}: invalid {field} at line {line}: {value!r}"
                  )
              if not number.is_integer():
                  raise RuntimeError(
                      f"{path}: invalid {field} at line {line}: {value!r}"
                  )
              return int(number)

          def read_csv(path, required):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"{path}: missing or empty")

              try:
                  with path.open(newline="", encoding="utf-8-sig") as handle:
                      reader = csv.DictReader(handle, strict=True)
                      fields = set(reader.fieldnames or [])
                      missing = set(required) - fields
                      if missing:
                          raise RuntimeError(
                              f"{path}: missing required columns: {sorted(missing)}"
                          )
                      rows = list(reader)
              except csv.Error as exc:
                  raise RuntimeError(f"{path}: malformed CSV: {exc}") from exc

              if not reader.fieldnames:
                  raise RuntimeError(f"{path}: missing CSV header")

              if not rows:
                  raise RuntimeError(f"{path}: contains no data rows")

              for line, row in enumerate(rows, start=2):
                  if None in row or any(value is None for value in row.values()):
                      raise RuntimeError(f"{path}: malformed row at line {line}")

              return rows

          expected_weeks = set()

          for selected in selected_files:
              match = re.fullmatch(r"week_(\d+)_CFB_selected\.csv", selected.name)
              if not match:
                  raise RuntimeError(f"Could not parse week from {selected.name}")

              week = int(match.group(1))
              expected_weeks.add(week)

              path = Path(
                  f"docs/win/football/cfb/04_final_results/graded/"
                  f"week_{week}_CFB_graded.csv"
              )

              rows = read_csv(
                  path,
                  {
                      "season",
                      "week",
                      "game_id",
                      "final_status",
                      "selected_bets",
                      "graded_bets",
                      "net_units",
                  },
              )

              for line, row in enumerate(rows, start=2):
                  if as_int(row["season"], "season", path, line) != season:
                      raise RuntimeError(f"{path}: wrong season at line {line}")
                  if as_int(row["week"], "week", path, line) != week:
                      raise RuntimeError(f"{path}: wrong week at line {line}")
                  if not str(row["game_id"]).strip():
                      raise RuntimeError(f"{path}: blank game_id at line {line}")

              print(f"Verified {path}: {len(rows)} rows")

          summary_path = Path(
              f"docs/win/football/cfb/04_final_results/graded/"
              f"season_{season}_summary.csv"
          )

          summary = read_csv(
              summary_path,
              {
                  "season",
                  "week",
                  "games",
                  "selected_bets",
                  "graded_bets",
                  "wins",
                  "losses",
                  "pushes",
                  "voids",
                  "pending_bets",
                  "net_units",
                  "roi_per_graded_bet",
              },
          )

          summary_weeks = set()
          total_rows = 0

          for line, row in enumerate(summary, start=2):
              if as_int(row["season"], "season", summary_path, line) != season:
                  raise RuntimeError(
                      f"{summary_path}: wrong season at line {line}"
                  )

              week_value = str(row["week"]).strip()

              if week_value == "TOTAL":
                  total_rows += 1
              else:
                  summary_weeks.add(
                      as_int(week_value, "week", summary_path, line)
                  )

          if total_rows != 1:
              raise RuntimeError(
                  f"{summary_path}: expected exactly one TOTAL row"
              )

          if summary_weeks != expected_weeks:
              raise RuntimeError(
                  f"{summary_path}: week coverage mismatch; "
                  f"expected {sorted(expected_weeks)}, "
                  f"found {sorted(summary_weeks)}"
              )

          print("All existing CFB graded outputs verified.")
          PY

      # ----------------------------------------------------------------------
      # BUILD ONE-ROW-PER-BET ANALYSIS LEDGER
      # ----------------------------------------------------------------------

      - name: Build CFB grading analysis ledger
        run: |
          python docs/win/football/cfb/scripts/04_final_results/02_cfb_results_analyze.py

      # ----------------------------------------------------------------------
      # BUILD CFB GRADING REPORTS
      # ----------------------------------------------------------------------

      - name: Build CFB grading reports
        run: |
          python docs/win/football/cfb/scripts/04_final_results/03_cfb_results_reports.py

      # ----------------------------------------------------------------------
      # VERIFY GRADING ANALYSIS + REPORTS
      # ----------------------------------------------------------------------

      - name: Verify CFB grading reports
        run: |
          python - <<'PY'
          import csv
          import math
          import os
          from pathlib import Path

          season = str(int(os.environ["CFB_SEASON"]))
          root = Path("docs/win/football/cfb/04_final_results")

          def read_csv(path, required=(), require_rows=False):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"{path}: missing or empty")

              try:
                  with path.open(newline="", encoding="utf-8-sig") as handle:
                      reader = csv.DictReader(handle, strict=True)
                      fields = set(reader.fieldnames or [])
                      missing = set(required) - fields
                      if missing:
                          raise RuntimeError(
                              f"{path}: missing required columns: {sorted(missing)}"
                          )
                      rows = list(reader)
              except csv.Error as exc:
                  raise RuntimeError(f"{path}: malformed CSV: {exc}") from exc

              if not reader.fieldnames:
                  raise RuntimeError(f"{path}: missing CSV header")

              if require_rows and not rows:
                  raise RuntimeError(f"{path}: contains no data rows")

              for line, row in enumerate(rows, start=2):
                  if None in row or any(value is None for value in row.values()):
                      raise RuntimeError(f"{path}: malformed row at line {line}")

              return rows

          work = read_csv(
              root / "intermediate/work_cfb.csv",
              {
                  "season",
                  "week",
                  "game_id",
                  "market_type",
                  "bet_result",
                  "bet_units",
                  "final_status",
                  "model_prob",
              },
          )

          has_bets = bool(work)

          for line, row in enumerate(work, start=2):
              if str(row["season"]).strip() != season:
                  raise RuntimeError(
                      f"work_cfb.csv: wrong season at line {line}"
                  )
              if not str(row["game_id"]).strip():
                  raise RuntimeError(
                      f"work_cfb.csv: blank game_id at line {line}"
                  )

          summary = read_csv(
              root / "cfb_summary_overall.csv",
              {
                  "league",
                  "season",
                  "market_type",
                  "Win",
                  "Loss",
                  "Pending",
                  "Total",
                  "Selected",
                  "Win_Pct",
                  "units",
              },
          )

          if has_bets and not summary:
              raise RuntimeError(
                  "cfb_summary_overall.csv contains no data rows"
              )

          for line, row in enumerate(summary, start=2):
              if str(row["league"]).strip() != "CFB":
                  raise RuntimeError(
                      f"cfb_summary_overall.csv: wrong league at line {line}"
                  )
              if str(row["season"]).strip() != season:
                  raise RuntimeError(
                      f"cfb_summary_overall.csv: wrong season at line {line}"
                  )

          overview = root / "reports/overview"

          for name in (
              "cfb_summary_overall.csv",
              "cfb_summary_by_market.csv",
              "cfb_summary_by_week.csv",
              "cfb_bet_log.csv",
          ):
              rows = read_csv(overview / name)
              if has_bets and not rows:
                  raise RuntimeError(
                      f"{overview / name}: contains no data rows"
                  )

          metric_columns = [
              "league",
              "season",
              "market_type",
              "settled_bets",
              "brier_score",
              "log_loss",
              "avg_model_prob",
              "observed_win_rate",
              "calibration_bias",
              "expected_calibration_error",
          ]

          calibration_columns = [
              "league",
              "season",
              "market_type",
              "probability_bucket",
              "settled_bets",
              "avg_model_prob",
              "observed_win_rate",
              "calibration_gap",
              "abs_calibration_gap",
          ]

          eligible_settled_bets = 0

          for row in work:
              if str(row["bet_result"]).strip().casefold() not in {"win", "loss"}:
                  continue

              try:
                  probability = float(str(row["model_prob"]).strip())
              except (TypeError, ValueError):
                  continue

              if math.isfinite(probability) and 0.0 <= probability <= 1.0:
                  eligible_settled_bets += 1

          def read_probability_report(path, expected_columns, require_rows):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"{path}: missing or empty")

              try:
                  with path.open(newline="", encoding="utf-8-sig") as handle:
                      reader = csv.DictReader(handle, strict=True)

                      if list(reader.fieldnames or []) != expected_columns:
                          raise RuntimeError(
                              f"{path}: unexpected columns: {reader.fieldnames}"
                          )

                      rows = list(reader)
              except csv.Error as exc:
                  raise RuntimeError(f"{path}: malformed CSV: {exc}") from exc

              if require_rows and not rows:
                  raise RuntimeError(
                      f"{path}: contains no rows despite eligible settled bets"
                  )

              for line, row in enumerate(rows, start=2):
                  if None in row or any(value is None for value in row.values()):
                      raise RuntimeError(f"{path}: malformed row at line {line}")

              return rows

          def number(row, field, path, line, minimum=None, maximum=None):
              try:
                  value = float(str(row[field]).strip())
              except (TypeError, ValueError):
                  raise RuntimeError(
                      f"{path}: invalid {field} at line {line}: {row[field]!r}"
                  )

              if not math.isfinite(value):
                  raise RuntimeError(
                      f"{path}: non-finite {field} at line {line}"
                  )

              if minimum is not None and value < minimum:
                  raise RuntimeError(
                      f"{path}: {field} below {minimum} at line {line}"
                  )

              if maximum is not None and value > maximum:
                  raise RuntimeError(
                      f"{path}: {field} above {maximum} at line {line}"
                  )

              return value

          def validate_common(row, path, line):
              if str(row["league"]).strip() != "CFB":
                  raise RuntimeError(f"{path}: wrong league at line {line}")

              try:
                  row_season = int(float(str(row["season"]).strip()))
              except (TypeError, ValueError):
                  raise RuntimeError(
                      f"{path}: invalid season at line {line}"
                  )

              if row_season != int(season):
                  raise RuntimeError(f"{path}: wrong season at line {line}")

              if not str(row["market_type"]).strip():
                  raise RuntimeError(
                      f"{path}: blank market_type at line {line}"
                  )

              settled = number(
                  row,
                  "settled_bets",
                  path,
                  line,
                  minimum=1.0,
              )

              if not settled.is_integer():
                  raise RuntimeError(
                      f"{path}: non-integer settled_bets at line {line}"
                  )

          probability_metrics_path = (
              overview / "cfb_probability_metrics.csv"
          )
          calibration_path = (
              overview / "cfb_calibration_by_probability.csv"
          )

          require_probability_rows = eligible_settled_bets > 0

          probability_metrics = read_probability_report(
              probability_metrics_path,
              metric_columns,
              require_probability_rows,
          )

          calibration = read_probability_report(
              calibration_path,
              calibration_columns,
              require_probability_rows,
          )

          if not require_probability_rows and (
              probability_metrics or calibration
          ):
              raise RuntimeError(
                  "Probability reports contain rows but no eligible settled bets exist"
              )

          for line, row in enumerate(probability_metrics, start=2):
              validate_common(
                  row,
                  probability_metrics_path,
                  line,
              )
              number(row, "brier_score", probability_metrics_path, line, 0.0, 1.0)
              number(row, "log_loss", probability_metrics_path, line, 0.0)
              number(row, "avg_model_prob", probability_metrics_path, line, 0.0, 1.0)
              number(row, "observed_win_rate", probability_metrics_path, line, 0.0, 1.0)
              number(row, "calibration_bias", probability_metrics_path, line, -1.0, 1.0)
              number(
                  row,
                  "expected_calibration_error",
                  probability_metrics_path,
                  line,
                  0.0,
                  1.0,
              )

          for line, row in enumerate(calibration, start=2):
              validate_common(row, calibration_path, line)
              number(row, "avg_model_prob", calibration_path, line, 0.0, 1.0)
              number(row, "observed_win_rate", calibration_path, line, 0.0, 1.0)
              number(row, "calibration_gap", calibration_path, line, -1.0, 1.0)
              number(row, "abs_calibration_gap", calibration_path, line, 0.0, 1.0)

          for name in ("moneyline", "spread", "totals"):
              directory = root / "reports" / name

              if not directory.is_dir():
                  raise RuntimeError(
                      f"{directory}: missing report directory"
                  )

              files = sorted(directory.rglob("*.csv"))

              if not files:
                  raise RuntimeError(
                      f"{directory}: contains no CSV reports"
                  )

              for path in files:
                  read_csv(path, require_rows=False)

          print("CFB grading analysis and reports verified.")
          PY

      # ----------------------------------------------------------------------
      # COMMIT AND PUSH
      #
      # Commits:
      # - recalculated picks for every existing week
      # - clean weekly picks
      # - all-games outputs
      # - final selected outputs
      # - refreshed final scores
      # - all graded weeks
      # - season grading summary
      # - work_cfb.csv
      # - all CFB grading reports
      # ----------------------------------------------------------------------

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/cfb/03_picks
          git add docs/win/football/cfb/04_final_results

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Rebuild and grade all CFB picks from markets config"
          if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
            git rebase --abort || true
            echo "ERROR: Could not update from origin/${GITHUB_REF_NAME}; conflicting changes were detected."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"


