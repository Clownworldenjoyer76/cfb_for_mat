name: NFL 01 Tuesday AM

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NFL_SEASON: "2026"

jobs:
  nfl-tuesday-am:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Pull NFL schedule
        run: |
          python docs/win/football/nfl/scripts/00_intake/pull_schedule.py

##### NEED TO ADD THE FINAL SCORES/GRADING STEPS HERE-ISH 
     # - name: Pull final scores
      #   run: |
      #     python docs/win/football/nfl/scripts/00_intake/pull_final_scores.py

      - name: Pull play-by-play
        run: |
          python docs/win/football/nfl/scripts/00_intake/pull_pbp.py \
            --season "$NFL_SEASON"

      - name: Build team statistics
        run: |
          set -o pipefail
          python docs/win/football/nfl/scripts/00_intake/pull_team_stats.py \
            --season "$NFL_SEASON" \
            2>&1 | tee docs/win/football/nfl/errors/00_intake/pull_team_stats.txt

      - name: Build quarterback statistics
        run: |
          python docs/win/football/nfl/scripts/00_intake/pull_qb_stats.py

      - name: Update league master and standings
        run: |
          python docs/win/football/nfl/scripts/00_intake/league_master.py

      - name: Update coaches
        run: |
          python docs/win/football/nfl/scripts/00_intake/coaches.py

      - name: Pull QBR
        run: |
          python docs/win/football/nfl/scripts/00_intake/pull_qbr.py

      - name: Pull team power index
        run: |
          python docs/win/football/nfl/scripts/00_intake/team_power_index.py

      - name: Pull league leaders
        run: |
          python docs/win/football/nfl/scripts/00_intake/pull_league_leaders.py

      - name: Pull market futures
        run: |
          python docs/win/football/nfl/scripts/00_intake/pull_market_futures.py

      - name: Build travel data
        run: |
          python docs/win/football/nfl/scripts/00_intake/build_travel.py

      - name: Validate Tuesday outputs
        run: |
          python docs/win/football/nfl/scripts/validation/validate_tuesday.py \
            --season "$NFL_SEASON"
            
      - name: Commit and push all Tuesday outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A docs/win/football/nfl/

          if git diff --cached --quiet; then
            echo "No NFL Tuesday output changes to commit."
          else
            git commit -m "Update NFL Tuesday AM data"
            git push
          fi
