name: test CFB Grading Reports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cfb-grading-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Build CFB grading analysis ledger
        run: |
          python docs/win/football/cfb/scripts/04_final_results/02_cfb_results_analyze.py

      - name: Build CFB grading reports
        run: |
          python docs/win/football/cfb/scripts/04_final_results/03_cfb_results_reports.py

      - name: Verify grading report outputs
        run: |
          test -f "docs/win/football/cfb/04_final_results/intermediate/work_cfb.csv"
          test -f "docs/win/football/cfb/04_final_results/cfb_summary_overall.csv"
          test -d "docs/win/football/cfb/04_final_results/reports"

          echo "CFB grading report outputs verified."

      - name: Commit and push CFB grading reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/cfb/04_final_results

          if git diff --cached --quiet; then
            echo "No CFB grading report changes to commit."
            exit 0
          fi

          git commit -m "Update CFB grading reports"
          git pull --rebase --autostash origin main
          git push origin "HEAD:${GITHUB_REF_NAME}"
