name: CFB 01 Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-cfb-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Load CFB season
        shell: bash
        run: |
          CFB_SEASON="$(
            sed -n 's/^[[:space:]]*season:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' docs/win/football/cfb/config/current_week.yaml |
              head -1
          )

          if ! [[ "$CFB_SEASON" =~ ^20[0-9]{2}$ ]]; then
            echo "ERROR: Invalid or missing season in docs/win/football/cfb/config/current_week.yaml"
            exit 1
          fi

          echo "CFB_SEASON=$CFB_SEASON" >> "$GITHUB_ENV"
          echo "Configured CFB season: $CFB_SEASON"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: docs/win/football/cfb/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r docs/win/football/cfb/requirements.txt

      # ----------------------------------------------------------------------
      # SCHEDULE
      # ----------------------------------------------------------------------

      - name: Pull CFB schedule
        run: python docs/win/football/cfb/scripts/00_intake/pull_schedule.py

      # ----------------------------------------------------------------------
      # FINAL SCORES + GRADING FOR PREVIOUS PICKS
      #
      # When this workflow is run for Week 2, Week 1 picks already exist.
      # Final Week 1 scores are pulled and Week 1 bets are graded here.
      #
      # When run for Week 3, existing Week 1 + Week 2 picks are refreshed
      # against ESPN finals, etc.
      # ----------------------------------------------------------------------

      - name: Pull final CFB scores
        run: |
          python docs/win/football/cfb/scripts/04_final_results/pull_final_scores.py \
            --season "$CFB_SEASON"

      - name: Grade existing CFB picks
        run: |
          python docs/win/football/cfb/scripts/04_final_results/grade_picks.py \
            --season "$CFB_SEASON"

      # ----------------------------------------------------------------------
      # COMPLETED GAME DATA FOR NEXT-WEEK MODEL
      # ----------------------------------------------------------------------

      - name: Pull completed CFB play-by-play
        run: |
          python docs/win/football/cfb/scripts/00_intake/pull_pbp.py \
            --season "$CFB_SEASON"

      - name: Build current-season team statistics
        run: |
          python docs/win/football/cfb/scripts/00_intake/pull_team_stats.py \
            --season "$CFB_SEASON"

      # ----------------------------------------------------------------------
      # CURRENT MARKET DATA
      # ----------------------------------------------------------------------

      - name: Pull current odds
        run: python docs/win/football/cfb/scripts/00_intake/pull_odds.py

      - name: Build target weekly schedule
        run: |
          python docs/win/football/cfb/scripts/00_intake/build_weekly_schedule.py

          CFB_WEEK="$(
            sed -n 's/^[[:space:]]*week:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' docs/win/football/cfb/config/current_week.yaml |
              head -1
          )

          if ! [[ "$CFB_WEEK" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid or missing week in docs/win/football/cfb/config/current_week.yaml"
            exit 1
          fi

          if [ "$CFB_WEEK" -le 1 ]; then
            echo "ERROR: cfb_pipeline.yml is for Week 2+."
            exit 1
          fi

          echo "CFB_WEEK=$CFB_WEEK" >> "$GITHUB_ENV"
          echo "Configured CFB target week: $CFB_WEEK"
      - name: Pull opening odds
        run: python docs/win/football/cfb/scripts/00_intake/pull_opening_odds.py

      # ----------------------------------------------------------------------
      # TEAM / ROSTER / CONTEXT DATA
      # ----------------------------------------------------------------------

      - name: Update league master
        run: python docs/win/football/cfb/scripts/00_intake/league_master.py

      - name: Pull raw rosters
        run: python docs/win/football/cfb/scripts/00_intake/pull_raw_roster.py

      - name: Clean rosters
        run: python docs/win/football/cfb/scripts/00_intake/roster_cleanup.py

      # Depth charts remain excluded from the current CFB pipeline.
      #
      # - name: Pull depth charts
      #   run: python docs/win/football/cfb/scripts/00_intake/depth_chart.py
      #
      # - name: Clean depth charts
      #   run: python docs/win/football/cfb/scripts/00_intake/depth_cleanup.py

      - name: Update coaches
        run: python docs/win/football/cfb/scripts/00_intake/coaches.py

      - name: Pull team power index
        run: python docs/win/football/cfb/scripts/00_intake/team_power_index.py

      - name: Pull injuries
        run: python docs/win/football/cfb/scripts/00_intake/pull_injuries.py

      # ----------------------------------------------------------------------
      # ESPN PREDICTIONS
      # ----------------------------------------------------------------------

      - name: Pull ESPN predictions
        run: python docs/win/football/cfb/scripts/00_intake/pull_e_predictions.py

      - name: Clean ESPN predictions
        run: python docs/win/football/cfb/scripts/00_intake/clean_e_pred.py

      - name: Finalize ESPN predictions
        run: python docs/win/football/cfb/scripts/00_intake/finalize_pred.py

      # ----------------------------------------------------------------------
      # TRAVEL + WEATHER
      # ----------------------------------------------------------------------

      - name: Build travel data
        run: python docs/win/football/cfb/scripts/00_intake/build_travel.py

      - name: Fetch weather
        run: python docs/win/football/cfb/scripts/00_intake/fetch_weather.py

      # ----------------------------------------------------------------------
      # WEEK 2+ PROJECTION
      # ----------------------------------------------------------------------

      - name: Build CFB in-season projection
        run: |
          python docs/win/football/cfb/scripts/01_merge/projection.py \
            --season "$CFB_SEASON" \
            --week "$CFB_WEEK"

      # ----------------------------------------------------------------------
      # CANDIDATE ENRICHMENT
      # ----------------------------------------------------------------------

      - name: Build betting candidates
        run: |
          python docs/win/football/cfb/scripts/02_select/selections.py \
            --season "$CFB_SEASON" \
            --week "$CFB_WEEK"

      # ----------------------------------------------------------------------
      # FILTERED PICKS
      # ----------------------------------------------------------------------

      - name: Apply markets filters
        run: |
          python docs/win/football/cfb/scripts/03_picks/picks.py \
            --pattern "week_${CFB_WEEK}_CFB_selected.csv"

      # ----------------------------------------------------------------------
      # CLEAN HUMAN-READABLE WEEKLY PICKS
      # ----------------------------------------------------------------------

      - name: Build clean weekly picks output
        run: |
          python docs/win/football/cfb/scripts/03_picks/clean_weekly_picks.py \
            --week "$CFB_WEEK"

      # ----------------------------------------------------------------------
      # COMPACT ALL-GAMES OUTPUT
      # ----------------------------------------------------------------------

      - name: Build all-games picks output
        run: |
          python docs/win/football/cfb/scripts/03_picks/all_games_picks.py \
            --week "$CFB_WEEK"

      # ----------------------------------------------------------------------
      # FINAL SELECTED PICKS OUTPUT
      # ----------------------------------------------------------------------

      - name: Build final selected picks output
        run: |
          python docs/win/football/cfb/scripts/03_picks/final_picks.py \
            --week "$CFB_WEEK"

      # ----------------------------------------------------------------------
      # VERIFY CURRENT-WEEK OUTPUTS
      # ----------------------------------------------------------------------

      - name: Verify pipeline outputs
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          season = int(os.environ["CFB_SEASON"])
          week = int(os.environ["CFB_WEEK"])

          paths = [
              Path(f"docs/win/football/cfb/01_merge/week_{week}_CFB_enriched.csv"),
              Path(f"docs/win/football/cfb/02_select/week_{week}_CFB_selected.csv"),
              Path(f"docs/win/football/cfb/03_picks/week_{week}_CFB_picks.csv"),
              Path(f"docs/win/football/cfb/03_picks/cleaned/week_{week}_CFB_clean_picks.csv"),
              Path(f"docs/win/football/cfb/03_picks/all_games/all_week_{week}_CFB_picks.csv"),
              Path(f"docs/win/football/cfb/03_picks/selected/week_{week}_CFB_select_picks.csv"),
          ]

          required = {"season", "week", "game_id"}

          def as_int(value, field, path, line):
              try:
                  number = float(str(value).strip())
              except (TypeError, ValueError):
                  raise RuntimeError(f"{path}: invalid {field} at line {line}: {value!r}")
              if not number.is_integer():
                  raise RuntimeError(f"{path}: invalid {field} at line {line}: {value!r}")
              return int(number)

          for path in paths:
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"{path}: missing or empty")

              try:
                  with path.open(newline="", encoding="utf-8-sig") as handle:
                      reader = csv.DictReader(handle, strict=True)
                      fields = set(reader.fieldnames or [])
                      missing = required - fields
                      if missing:
                          raise RuntimeError(f"{path}: missing required columns: {sorted(missing)}")
                      rows = list(reader)
              except csv.Error as exc:
                  raise RuntimeError(f"{path}: malformed CSV: {exc}") from exc

              if not rows:
                  raise RuntimeError(f"{path}: contains no data rows")

              for line, row in enumerate(rows, start=2):
                  if None in row or any(value is None for value in row.values()):
                      raise RuntimeError(f"{path}: malformed row at line {line}")
                  if as_int(row["season"], "season", path, line) != season:
                      raise RuntimeError(f"{path}: wrong season at line {line}")
                  if as_int(row["week"], "week", path, line) != week:
                      raise RuntimeError(f"{path}: wrong week at line {line}")
                  if not str(row["game_id"]).strip():
                      raise RuntimeError(f"{path}: blank game_id at line {line}")

              print(f"Verified {path}: {len(rows)} rows")

          print(f"CFB Week {week} pipeline outputs verified.")
          PY

      # ----------------------------------------------------------------------
      # GRADING ANALYSIS + REPORTS
      #
      # These run after all normal CFB processing is complete.
      # They analyze all currently graded CFB bets and rebuild the
      # season grading reports.
      # ----------------------------------------------------------------------

      - name: Build CFB grading analysis ledger
        run: |
          python docs/win/football/cfb/scripts/04_final_results/02_cfb_results_analyze.py

      - name: Build CFB grading reports
        run: |
          python docs/win/football/cfb/scripts/04_final_results/03_cfb_results_reports.py

      - name: Verify CFB grading reports
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          season = str(int(os.environ["CFB_SEASON"]))
          root = Path("docs/win/football/cfb/04_final_results")

          def read_csv(path, required=(), require_rows=True):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"{path}: missing or empty")

              try:
                  with path.open(newline="", encoding="utf-8-sig") as handle:
                      reader = csv.DictReader(handle, strict=True)
                      fields = set(reader.fieldnames or [])
                      missing = set(required) - fields
                      if missing:
                          raise RuntimeError(
                              f"{path}: missing required columns: {sorted(missing)}"
                          )
                      rows = list(reader)
              except csv.Error as exc:
                  raise RuntimeError(f"{path}: malformed CSV: {exc}") from exc

              if not reader.fieldnames:
                  raise RuntimeError(f"{path}: missing CSV header")

              if require_rows and not rows:
                  raise RuntimeError(f"{path}: contains no data rows")

              for line, row in enumerate(rows, start=2):
                  if None in row or any(value is None for value in row.values()):
                      raise RuntimeError(f"{path}: malformed row at line {line}")

              return rows

          work = read_csv(
              root / "intermediate/work_cfb.csv",
              {"season", "week", "game_id", "market_type", "bet_result", "bet_units", "final_status"},
          )

          for line, row in enumerate(work, start=2):
              if str(row["season"]).strip() != season:
                  raise RuntimeError(f"work_cfb.csv: wrong season at line {line}")
              if not str(row["game_id"]).strip():
                  raise RuntimeError(f"work_cfb.csv: blank game_id at line {line}")

          summary = read_csv(
              root / "cfb_summary_overall.csv",
              {"league", "season", "market_type", "Win", "Loss", "Pending", "Total", "Selected", "Win_Pct", "units"},
          )

          for line, row in enumerate(summary, start=2):
              if str(row["league"]).strip() != "CFB":
                  raise RuntimeError(f"cfb_summary_overall.csv: wrong league at line {line}")
              if str(row["season"]).strip() != season:
                  raise RuntimeError(f"cfb_summary_overall.csv: wrong season at line {line}")

          overview = root / "reports/overview"
          for name in (
              "cfb_summary_overall.csv",
              "cfb_summary_by_market.csv",
              "cfb_summary_by_week.csv",
              "cfb_bet_log.csv",
          ):
              read_csv(overview / name)

          for name in ("moneyline", "spread", "totals"):
              directory = root / "reports" / name
              if not directory.is_dir():
                  raise RuntimeError(f"{directory}: missing report directory")

              files = sorted(directory.rglob("*.csv"))
              if not files:
                  raise RuntimeError(f"{directory}: contains no CSV reports")

              for path in files:
                  read_csv(path, require_rows=False)

          print("CFB grading analysis and reports verified.")
          PY

      # ----------------------------------------------------------------------
      # COMMIT EVERYTHING
      #
      # Includes:
      # - final scores
      # - graded previous-week picks
      # - season grading summary
      # - grading analysis ledger
      # - grading reports
      # - PBP/team stats
      # - current-week projections
      # - current-week selections/picks
      # - clean human-readable weekly picks
      # ----------------------------------------------------------------------

      - name: Commit and push CFB pipeline outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/cfb

          if git diff --cached --quiet; then
            echo "No CFB pipeline changes to commit."
            exit 0
          fi

          git commit -m "Run CFB Week ${CFB_WEEK} pipeline"

          if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
            git rebase --abort || true
            echo "ERROR: Could not update from origin/${GITHUB_REF_NAME}; conflicting changes were detected."
            exit 1
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ----------------------------------------------------------------------
      # PIPELINE HEALTH
      # ----------------------------------------------------------------------

      - name: CFB Pipeline Health
        if: always()
        env:
          CFB_PIPELINE_JOB_STATUS: ${{ job.status }}
        run: python docs/win/football/cfb/scripts/pipeline_health.py

      - name: Commit CFB pipeline health
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/cfb/pipeline_health.json
          git add docs/win/football/cfb/errors/pipeline_health.txt
          git add frontend/data/pipeline_health/cfb.json

          if git diff --cached --quiet; then
            echo "No CFB pipeline health changes to commit."
            exit 0
          fi

          git commit -m "Update CFB pipeline health"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
