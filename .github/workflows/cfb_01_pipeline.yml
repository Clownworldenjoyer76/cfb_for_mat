name: CFB 01 Pipeline

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: repo-write-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-cfb-pipeline:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Load CFB season
        shell: bash
        run: |
          CFB_SEASON="$(
            sed -n 's/^[[:space:]]*season:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' docs/win/football/cfb/config/current_week.yaml |
              head -1
          )"

          if ! [[ "$CFB_SEASON" =~ ^20[0-9]{2}$ ]]; then
            echo "ERROR: Invalid or missing season in docs/win/football/cfb/config/current_week.yaml"
            exit 1
          fi

          echo "CFB_SEASON=$CFB_SEASON" >> "$GITHUB_ENV"
          echo "Configured CFB season: $CFB_SEASON"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: docs/win/football/cfb/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r docs/win/football/cfb/requirements.txt

      # ----------------------------------------------------------------------
      # SCHEDULE
      # ----------------------------------------------------------------------

      - name: Pull CFB schedule
        run: python docs/win/football/cfb/scripts/00_intake/pull_schedule.py

      # ----------------------------------------------------------------------
      # FINAL SCORES
      #
      # Pull final scores early so completed-game data is available to the
      # model and to grading later in this workflow. Grading itself must run
      # only after markets.yaml has been replayed across every existing week.
      # ----------------------------------------------------------------------

      - name: Pull final CFB scores
        run: |
          python docs/win/football/cfb/scripts/04_final_results/pull_final_scores.py \
            --season "$CFB_SEASON"

      # ----------------------------------------------------------------------
      # COMPLETED GAME DATA FOR NEXT-WEEK MODEL
      # ----------------------------------------------------------------------

      - name: Pull completed CFB play-by-play
        run: |
          python docs/win/football/cfb/scripts/00_intake/pull_pbp.py \
            --season "$CFB_SEASON"

      - name: Build current-season team statistics
        run: |
          python docs/win/football/cfb/scripts/00_intake/pull_team_stats.py \
            --season "$CFB_SEASON"

      # ----------------------------------------------------------------------
      # CURRENT MARKET DATA
      # ----------------------------------------------------------------------

      - name: Pull current odds
        run: python docs/win/football/cfb/scripts/00_intake/pull_odds.py

      - name: Build target weekly schedule
        run: |
          python docs/win/football/cfb/scripts/00_intake/build_weekly_schedule.py

          CFB_WEEK="$(
            sed -n 's/^[[:space:]]*week:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' docs/win/football/cfb/config/current_week.yaml |
              head -1
          )"

          if ! [[ "$CFB_WEEK" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid or missing week in docs/win/football/cfb/config/current_week.yaml"
            exit 1
          fi

          if [ "$CFB_WEEK" -le 1 ]; then
            echo "ERROR: cfb_01_pipeline.yml is for Week 2+."
            exit 1
          fi

          echo "CFB_WEEK=$CFB_WEEK" >> "$GITHUB_ENV"
          echo "Configured CFB target week: $CFB_WEEK"

      - name: Pull opening odds
        run: python docs/win/football/cfb/scripts/00_intake/pull_opening_odds.py

      # ----------------------------------------------------------------------
      # TEAM / ROSTER / CONTEXT DATA
      # ----------------------------------------------------------------------

      - name: Update league master
        run: python docs/win/football/cfb/scripts/00_intake/league_master.py

      - name: Pull raw rosters
        run: python docs/win/football/cfb/scripts/00_intake/pull_raw_roster.py

      - name: Clean rosters
        run: python docs/win/football/cfb/scripts/00_intake/roster_cleanup.py

      # Depth charts remain excluded from the current CFB pipeline.
      #
      # - name: Pull depth charts
      #   run: python docs/win/football/cfb/scripts/00_intake/depth_chart.py
      #
      # - name: Clean depth charts
      #   run: python docs/win/football/cfb/scripts/00_intake/depth_cleanup.py

      - name: Update coaches
        run: python docs/win/football/cfb/scripts/00_intake/coaches.py

      - name: Pull team power index
        run: python docs/win/football/cfb/scripts/00_intake/team_power_index.py

      - name: Pull injuries
        run: python docs/win/football/cfb/scripts/00_intake/pull_injuries.py

      # ----------------------------------------------------------------------
      # ESPN PREDICTIONS
      # ----------------------------------------------------------------------

      - name: Pull ESPN predictions
        run: python docs/win/football/cfb/scripts/00_intake/pull_e_predictions.py

      - name: Clean ESPN predictions
        run: python docs/win/football/cfb/scripts/00_intake/clean_e_pred.py

      - name: Finalize ESPN predictions
        run: python docs/win/football/cfb/scripts/00_intake/finalize_pred.py

      # ----------------------------------------------------------------------
      # TRAVEL + WEATHER
      # ----------------------------------------------------------------------

      - name: Build travel data
        run: python docs/win/football/cfb/scripts/00_intake/build_travel.py

      - name: Fetch weather
        run: python docs/win/football/cfb/scripts/00_intake/fetch_weather.py

      # ----------------------------------------------------------------------
      # WEEK 2+ PROJECTION
      # ----------------------------------------------------------------------

      - name: Build CFB in-season projection
        run: |
          python docs/win/football/cfb/scripts/01_merge/projection.py \
            --season "$CFB_SEASON" \
            --week "$CFB_WEEK"

      # ----------------------------------------------------------------------
      # CANDIDATE ENRICHMENT
      # ----------------------------------------------------------------------

      - name: Build betting candidates
        run: |
          python docs/win/football/cfb/scripts/02_select/selections.py \
            --season "$CFB_SEASON" \
            --week "$CFB_WEEK"

      # ----------------------------------------------------------------------
      # FILTERED PICKS
      # ----------------------------------------------------------------------

      - name: Apply markets filters to all existing weeks
        run: |
          python docs/win/football/cfb/scripts/03_picks/picks.py \
            --pattern "week_*_CFB_selected.csv"

      # ----------------------------------------------------------------------
      # CLEAN HUMAN-READABLE WEEKLY PICKS
      # ----------------------------------------------------------------------

      - name: Rebuild clean weekly picks outputs for all existing weeks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          SELECTED_FILES=(docs/win/football/cfb/02_select/week_*_CFB_selected.csv)

          if [ "${#SELECTED_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No CFB selected candidate files found."
            exit 1
          fi

          for SELECTED_FILE in "${SELECTED_FILES[@]}"; do
            FILE_NAME="$(basename "$SELECTED_FILE")"
            WEEK="${FILE_NAME#week_}"
            WEEK="${WEEK%_CFB_selected.csv}"

            if ! [[ "$WEEK" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Could not parse week from $SELECTED_FILE"
              exit 1
            fi

            PICKS_FILE="docs/win/football/cfb/03_picks/week_${WEEK}_CFB_picks.csv"

            if [ ! -s "$PICKS_FILE" ]; then
              echo "ERROR: Missing rebuilt picks file: $PICKS_FILE"
              exit 1
            fi

            python docs/win/football/cfb/scripts/03_picks/clean_weekly_picks.py \
              --week "$WEEK"
          done

      # ----------------------------------------------------------------------
      # COMPACT ALL-GAMES OUTPUT
      # ----------------------------------------------------------------------

      - name: Build all-games picks output
        run: |
          python docs/win/football/cfb/scripts/03_picks/all_games_picks.py \
            --week "$CFB_WEEK"

      # ----------------------------------------------------------------------
      # FINAL SELECTED PICKS OUTPUT
      # ----------------------------------------------------------------------

      - name: Rebuild final selected picks outputs for all existing weeks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          SELECTED_FILES=(docs/win/football/cfb/02_select/week_*_CFB_selected.csv)

          if [ "${#SELECTED_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No CFB selected candidate files found."
            exit 1
          fi

          for SELECTED_FILE in "${SELECTED_FILES[@]}"; do
            FILE_NAME="$(basename "$SELECTED_FILE")"
            WEEK="${FILE_NAME#week_}"
            WEEK="${WEEK%_CFB_selected.csv}"

            if ! [[ "$WEEK" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Could not parse week from $SELECTED_FILE"
              exit 1
            fi

            PICKS_FILE="docs/win/football/cfb/03_picks/week_${WEEK}_CFB_picks.csv"

            if [ ! -s "$PICKS_FILE" ]; then
              echo "ERROR: Missing rebuilt picks file: $PICKS_FILE"
              exit 1
            fi

            python docs/win/football/cfb/scripts/03_picks/final_picks.py \
              --week "$WEEK"
          done

      # ----------------------------------------------------------------------
      # VERIFY CURRENT-WEEK OUTPUTS
      # ----------------------------------------------------------------------

      - name: Verify pipeline outputs
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          season = int(os.environ["CFB_SEASON"])
          week = int(os.environ["CFB_WEEK"])

          paths = [
              Path(f"docs/win/football/cfb/01_merge/week_{week}_CFB_enriched.csv"),
              Path(f"docs/win/football/cfb/02_select/week_{week}_CFB_selected.csv"),
              Path(f"docs/win/football/cfb/03_picks/week_{week}_CFB_picks.csv"),
              Path(f"docs/win/football/cfb/03_picks/cleaned/week_{week}_CFB_clean_picks.csv"),
              Path(f"docs/win/football/cfb/03_picks/all_games/all_week_{week}_CFB_picks.csv"),
              Path(f"docs/win/football/cfb/03_picks/selected/week_{week}_CFB_select_picks.csv"),
          ]

          required = {"season", "week", "game_id"}

          def as_int(value, field, path, line):
              try:
                  number = float(str(value).strip())
              except (TypeError, ValueError):
                  raise RuntimeError(
                      f"{path}: invalid {field} at line {line}: {value!r}"
                  )

              if not number.is_integer():
                  raise RuntimeError(
                      f"{path}: invalid {field} at line {line}: {value!r}"
                  )

              return int(number)

          for path in paths:
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"{path}: missing or empty")

              try:
                  with path.open(
                      newline="",
                      encoding="utf-8-sig",
                  ) as handle:
                      reader = csv.DictReader(
                          handle,
                          strict=True,
                      )

                      fields = set(reader.fieldnames or [])
                      missing = required - fields

                      if missing:
                          raise RuntimeError(
                              f"{path}: missing required columns: "
                              f"{sorted(missing)}"
                          )

                      rows = list(reader)

              except csv.Error as exc:
                  raise RuntimeError(
                      f"{path}: malformed CSV: {exc}"
                  ) from exc

              is_selected_output = (
                  path.parent.name == "selected"
                  and path.name
                  == f"week_{week}_CFB_select_picks.csv"
              )

              if not rows and not is_selected_output:
                  raise RuntimeError(
                      f"{path}: contains no data rows"
                  )

              for line, row in enumerate(
                  rows,
                  start=2,
              ):
                  if (
                      None in row
                      or any(
                          value is None
                          for value in row.values()
                      )
                  ):
                      raise RuntimeError(
                          f"{path}: malformed row at line {line}"
                      )

                  if (
                      as_int(
                          row["season"],
                          "season",
                          path,
                          line,
                      )
                      != season
                  ):
                      raise RuntimeError(
                          f"{path}: wrong season at line {line}"
                      )

                  if (
                      as_int(
                          row["week"],
                          "week",
                          path,
                          line,
                      )
                      != week
                  ):
                      raise RuntimeError(
                          f"{path}: wrong week at line {line}"
                      )

                  if not str(row["game_id"]).strip():
                      raise RuntimeError(
                          f"{path}: blank game_id at line {line}"
                      )

              print(
                  f"Verified {path}: {len(rows)} rows"
              )

          print(
              f"CFB Week {week} pipeline outputs verified."
          )
          PY

      # ----------------------------------------------------------------------
      # GRADE REBUILT PICKS
      #
      # markets.yaml has now been replayed across every existing week.
      # Grade only after that replay so 04_final_results is built from the
      # same current selections that exist in 03_picks.
      # ----------------------------------------------------------------------

      - name: Grade rebuilt CFB picks
        run: |
          python docs/win/football/cfb/scripts/04_final_results/grade_picks.py \
            --season "$CFB_SEASON"

      - name: Verify grading matches rebuilt picks
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          from pathlib import Path

          season = int(os.environ["CFB_SEASON"])

          picks_dir = Path("docs/win/football/cfb/03_picks")
          graded_dir = Path("docs/win/football/cfb/04_final_results/graded")
          summary_path = graded_dir / f"season_{season}_summary.csv"

          flag_columns = (
              "ml_selected",
              "spread_selected",
              "total_selected",
          )

          pick_pattern = re.compile(r"^week_(\d+)_CFB_picks\.csv$")
          graded_pattern = re.compile(r"^week_(\d+)_CFB_graded\.csv$")

          def read_csv(path, required):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"{path}: missing or empty")

              try:
                  with path.open(
                      newline="",
                      encoding="utf-8-sig",
                  ) as handle:
                      reader = csv.DictReader(handle, strict=True)
                      fields = set(reader.fieldnames or [])
                      missing = set(required) - fields

                      if missing:
                          raise RuntimeError(
                              f"{path}: missing required columns: {sorted(missing)}"
                          )

                      rows = list(reader)

              except csv.Error as exc:
                  raise RuntimeError(
                      f"{path}: malformed CSV: {exc}"
                  ) from exc

              if not reader.fieldnames:
                  raise RuntimeError(f"{path}: missing CSV header")

              for line, row in enumerate(rows, start=2):
                  if None in row or any(value is None for value in row.values()):
                      raise RuntimeError(f"{path}: malformed row at line {line}")

              return rows

          def as_int(value, field, path, line):
              try:
                  number = float(str(value).strip())
              except (TypeError, ValueError):
                  raise RuntimeError(
                      f"{path}: invalid {field} at line {line}: {value!r}"
                  )

              if not number.is_integer():
                  raise RuntimeError(
                      f"{path}: non-integer {field} at line {line}: {value!r}"
                  )

              return int(number)

          def as_flag(value, field, path, line):
              normalized = str(value).strip().casefold()

              if normalized in {"1", "1.0", "true", "yes", "y"}:
                  return 1

              if normalized in {"0", "0.0", "false", "no", "n"}:
                  return 0

              raise RuntimeError(
                  f"{path}: invalid {field} flag at line {line}: {value!r}"
              )

          pick_files = []

          for path in sorted(picks_dir.glob("week_*_CFB_picks.csv")):
              match = pick_pattern.fullmatch(path.name)

              if match:
                  pick_files.append((int(match.group(1)), path))

          if not pick_files:
              raise RuntimeError("No week_*_CFB_picks.csv files found.")

          expected = {}

          for filename_week, path in pick_files:
              rows = read_csv(
                  path,
                  {
                      "season",
                      "week",
                      "game_id",
                      *flag_columns,
                  },
              )

              counts = {name: 0 for name in flag_columns}

              for line, row in enumerate(rows, start=2):
                  if as_int(row["season"], "season", path, line) != season:
                      raise RuntimeError(
                          f"{path}: wrong season at line {line}"
                      )

                  row_week = as_int(row["week"], "week", path, line)

                  if row_week != filename_week:
                      raise RuntimeError(
                          f"{path}: filename week={filename_week} "
                          f"but row week={row_week} at line {line}"
                      )

                  if not str(row["game_id"]).strip():
                      raise RuntimeError(
                          f"{path}: blank game_id at line {line}"
                      )

                  for name in flag_columns:
                      counts[name] += as_flag(
                          row[name],
                          name,
                          path,
                          line,
                      )

              expected[filename_week] = counts

          expected_weeks = set(expected)

          graded_files = {}

          for path in sorted(graded_dir.glob("week_*_CFB_graded.csv")):
              match = graded_pattern.fullmatch(path.name)

              if match:
                  graded_files[int(match.group(1))] = path

          if set(graded_files) != expected_weeks:
              raise RuntimeError(
                  "Graded week coverage does not match rebuilt picks. "
                  f"picks={sorted(expected_weeks)} "
                  f"graded={sorted(graded_files)}"
              )

          actual = {}

          for week in sorted(expected_weeks):
              path = graded_files[week]

              rows = read_csv(
                  path,
                  {
                      "season",
                      "week",
                      "game_id",
                      "selected_bets",
                      *flag_columns,
                  },
              )

              counts = {name: 0 for name in flag_columns}
              selected_bets = 0

              for line, row in enumerate(rows, start=2):
                  if as_int(row["season"], "season", path, line) != season:
                      raise RuntimeError(
                          f"{path}: wrong season at line {line}"
                      )

                  row_week = as_int(row["week"], "week", path, line)

                  if row_week != week:
                      raise RuntimeError(
                          f"{path}: filename week={week} "
                          f"but row week={row_week} at line {line}"
                      )

                  row_flags = {
                      name: as_flag(
                          row[name],
                          name,
                          path,
                          line,
                      )
                      for name in flag_columns
                  }

                  row_selected = as_int(
                      row["selected_bets"],
                      "selected_bets",
                      path,
                      line,
                  )

                  if row_selected != sum(row_flags.values()):
                      raise RuntimeError(
                          f"{path}: selected_bets does not equal market flags "
                          f"at line {line}"
                      )

                  selected_bets += row_selected

                  for name, value in row_flags.items():
                      counts[name] += value

              if counts != expected[week]:
                  raise RuntimeError(
                      f"Week {week}: graded market counts do not match rebuilt picks. "
                      f"expected={expected[week]} actual={counts}"
                  )

              expected_selected = sum(expected[week].values())

              if selected_bets != expected_selected:
                  raise RuntimeError(
                      f"Week {week}: graded selected_bets={selected_bets} "
                      f"does not match rebuilt picks={expected_selected}"
                  )

              actual[week] = counts

          summary_rows = read_csv(
              summary_path,
              {
                  "season",
                  "week",
                  "selected_bets",
              },
          )

          summary_by_week = {}
          total_selected = None

          for line, row in enumerate(summary_rows, start=2):
              if as_int(row["season"], "season", summary_path, line) != season:
                  raise RuntimeError(
                      f"{summary_path}: wrong season at line {line}"
                  )

              week_value = str(row["week"]).strip()

              if week_value == "TOTAL":
                  if total_selected is not None:
                      raise RuntimeError(
                          f"{summary_path}: duplicate TOTAL row"
                      )

                  total_selected = as_int(
                      row["selected_bets"],
                      "selected_bets",
                      summary_path,
                      line,
                  )
                  continue

              week = as_int(
                  week_value,
                  "week",
                  summary_path,
                  line,
              )

              if week in summary_by_week:
                  raise RuntimeError(
                      f"{summary_path}: duplicate Week {week} row"
                  )

              summary_by_week[week] = as_int(
                  row["selected_bets"],
                  "selected_bets",
                  summary_path,
                  line,
              )

          if set(summary_by_week) != expected_weeks:
              raise RuntimeError(
                  "Season summary week coverage does not match rebuilt picks. "
                  f"picks={sorted(expected_weeks)} "
                  f"summary={sorted(summary_by_week)}"
              )

          expected_total = 0

          for week in sorted(expected_weeks):
              week_total = sum(expected[week].values())
              expected_total += week_total

              if summary_by_week[week] != week_total:
                  raise RuntimeError(
                      f"Week {week}: summary selected_bets="
                      f"{summary_by_week[week]} does not match rebuilt picks="
                      f"{week_total}"
                  )

          if total_selected is None:
              raise RuntimeError(
                  f"{summary_path}: missing TOTAL row"
              )

          if total_selected != expected_total:
              raise RuntimeError(
                  f"{summary_path}: TOTAL selected_bets={total_selected} "
                  f"does not match rebuilt picks={expected_total}"
              )

          market_totals = {
              name: sum(
                  expected[week][name]
                  for week in expected_weeks
              )
              for name in flag_columns
          }

          print(
              "Grading matches rebuilt picks: "
              f"weeks={sorted(expected_weeks)} "
              f"moneyline={market_totals['ml_selected']} "
              f"spread={market_totals['spread_selected']} "
              f"total={market_totals['total_selected']} "
              f"selected_bets={expected_total}"
          )
          PY
      # ----------------------------------------------------------------------
      # GRADING ANALYSIS + REPORTS
      #
      # These run after all normal CFB processing is complete.
      # They analyze all currently graded CFB bets and rebuild the
      # season grading reports.
      # ----------------------------------------------------------------------

      - name: Build CFB grading analysis ledger
        run: |
          python docs/win/football/cfb/scripts/04_final_results/02_cfb_results_analyze.py

      - name: Build CFB grading reports
        run: |
          python docs/win/football/cfb/scripts/04_final_results/03_cfb_results_reports.py

      - name: Verify CFB grading reports
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          season = str(
              int(
                  os.environ["CFB_SEASON"]
              )
          )

          root = Path(
              "docs/win/football/cfb/04_final_results"
          )

          def read_csv(
              path,
              required=(),
              require_rows=False,
          ):
              if (
                  not path.is_file()
                  or path.stat().st_size == 0
              ):
                  raise RuntimeError(
                      f"{path}: missing or empty"
                  )

              try:
                  with path.open(
                      newline="",
                      encoding="utf-8-sig",
                  ) as handle:
                      reader = csv.DictReader(
                          handle,
                          strict=True,
                      )

                      fields = set(
                          reader.fieldnames or []
                      )

                      missing = (
                          set(required)
                          - fields
                      )

                      if missing:
                          raise RuntimeError(
                              f"{path}: missing required columns: "
                              f"{sorted(missing)}"
                          )

                      rows = list(reader)

              except csv.Error as exc:
                  raise RuntimeError(
                      f"{path}: malformed CSV: {exc}"
                  ) from exc

              if not reader.fieldnames:
                  raise RuntimeError(
                      f"{path}: missing CSV header"
                  )

              if require_rows and not rows:
                  raise RuntimeError(
                      f"{path}: contains no data rows"
                  )

              for line, row in enumerate(
                  rows,
                  start=2,
              ):
                  if (
                      None in row
                      or any(
                          value is None
                          for value in row.values()
                      )
                  ):
                      raise RuntimeError(
                          f"{path}: malformed row at line {line}"
                      )

              return rows

          work = read_csv(
              root / "intermediate/work_cfb.csv",
              {
                  "season",
                  "week",
                  "game_id",
                  "market_type",
                  "bet_result",
                  "bet_units",
                  "final_status",
              },
          )

          has_bets = bool(work)

          for line, row in enumerate(
              work,
              start=2,
          ):
              if str(row["season"]).strip() != season:
                  raise RuntimeError(
                      f"work_cfb.csv: wrong season at line {line}"
                  )

              if not str(row["game_id"]).strip():
                  raise RuntimeError(
                      f"work_cfb.csv: blank game_id at line {line}"
                  )

          summary = read_csv(
              root / "cfb_summary_overall.csv",
              {
                  "league",
                  "season",
                  "market_type",
                  "Win",
                  "Loss",
                  "Pending",
                  "Total",
                  "Selected",
                  "Win_Pct",
                  "units",
              },
          )

          if has_bets and not summary:
              raise RuntimeError(
                  "cfb_summary_overall.csv contains no data rows"
              )

          for line, row in enumerate(
              summary,
              start=2,
          ):
              if str(row["league"]).strip() != "CFB":
                  raise RuntimeError(
                      "cfb_summary_overall.csv: "
                      f"wrong league at line {line}"
                  )

              if str(row["season"]).strip() != season:
                  raise RuntimeError(
                      "cfb_summary_overall.csv: "
                      f"wrong season at line {line}"
                  )

          overview = (
              root
              / "reports"
              / "overview"
          )

          for name in (
              "cfb_summary_overall.csv",
              "cfb_summary_by_market.csv",
              "cfb_summary_by_week.csv",
              "cfb_bet_log.csv",
          ):
              rows = read_csv(
                  overview / name
              )

              if has_bets and not rows:
                  raise RuntimeError(
                      f"{overview / name}: "
                      "contains no data rows"
                  )

          for name in (
              "moneyline",
              "spread",
              "totals",
          ):
              directory = (
                  root
                  / "reports"
                  / name
              )

              if not directory.is_dir():
                  raise RuntimeError(
                      f"{directory}: missing report directory"
                  )

              files = sorted(
                  directory.rglob("*.csv")
              )

              if not files:
                  raise RuntimeError(
                      f"{directory}: contains no CSV reports"
                  )

              for path in files:
                  read_csv(
                      path,
                      require_rows=False,
                  )

          print(
              "CFB grading analysis and reports verified."
          )
          PY

      # ----------------------------------------------------------------------
      # PIPELINE HEALTH GATE
      #
      # Health runs before publication. Any fatal health failure stops the
      # workflow before generated CFB artifacts can be committed to main.
      # ----------------------------------------------------------------------

      - name: CFB Pipeline Health Gate
        env:
          CFB_PIPELINE_JOB_STATUS: success
        run: python docs/win/football/cfb/scripts/pipeline_health.py

      # ----------------------------------------------------------------------
      # COMMIT EVERYTHING
      #
      # Includes:
      # - final scores
      # - graded previous-week picks
      # - season grading summary
      # - grading analysis ledger
      # - grading reports
      # - PBP/team stats
      # - current-week projections
      # - current-week selections/picks
      # - clean human-readable weekly picks
      # - validated pipeline health outputs
      #
      # This step is reached only after the health gate succeeds.
      # ----------------------------------------------------------------------

      - name: Commit and push CFB pipeline outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/cfb
          git add frontend/data/pipeline_health/cfb.json

          if git diff --cached --quiet; then
            echo "No CFB pipeline changes to commit."
            exit 0
          fi

          git commit -m "Run CFB Week ${CFB_WEEK} pipeline"

          if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
            git rebase --abort || true
            echo "ERROR: Could not update from origin/${GITHUB_REF_NAME}; conflicting changes were detected."
            exit 1
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"
